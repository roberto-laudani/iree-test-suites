name: Test ResNet50 (CPU)
on:
  pull_request:
    paths:
      - ".github/workflows/test_resnet50.yml"
      - "pytest_iree/**"
      - "torch_models/conftest.py"
      - "torch_models/requirements*.txt"
      - "torch_models/resnet50/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test-resnet50:
    runs-on: ubuntu-latest
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Setup Python venv
        run: python3 -m venv ${VENV_DIR}
      - name: Install harness + IREE nightly packages (no torch needed)
        run: |
          source ${VENV_DIR}/bin/activate
          python3 -m pip install -e .
          python3 -m pip install -r torch_models/requirements.txt
          python3 -m pip install -r torch_models/requirements-iree.txt

      # Compiles the committed resnet50.mlir, downloads the pinned weights from
      # the Hugging Face Hub (public, no token), runs on llvm-cpu, and compares
      # the output logits against the committed golden within tolerance.
      # No torch / transformers / iree-turbine.
      - name: Run ResNet50 CPU quality test
        run: |
          source ${VENV_DIR}/bin/activate
          pytest \
            torch_models \
            -rpFe \
            --log-cli-level=info \
            -o log_cli=True \
            --durations=0 \
            --timeout=1200 \
            --capture=no \
            --test-file-directory=torch_models/resnet50 \
            --module-directory=torch_models \
            --external-file-directory=torch_models/resnet50 \
            --artifact-directory=${{ github.workspace }}/artifacts \
            --job-summary-path=${{ github.workspace }} \
            -m cpu

      - name: Upload ResNet50 job summary
        if: always()
        run: |
          cat ${{ github.workspace }}/job_summary.md >> $GITHUB_STEP_SUMMARY
